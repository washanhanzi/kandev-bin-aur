name: Update kandev-bin

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kandev-bin
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the latest stable Kandev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-package.sh

      - name: Push package changes to GitHub
        run: |
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            exit 0
          fi
          version=$(awk '$1 == "pkgver" { print $3; exit }' .SRCINFO)
          git commit -m "chore(aur): update kandev-bin to ${version}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Sync the AUR package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::warning::Set AUR_SSH_PRIVATE_KEY to enable automatic AUR publishing."
            exit 0
          fi
          bash scripts/publish-aur.sh
